<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TileWeaver — Help / Довідка</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#12140d; --panel:#1b1f16; --panel2:#232a1c; --line:#3a4230;
    --amber:#e8b84b; --text:#e8e6df; --green:#5a9a4a; --rust:#c9622e; --danger:#a83a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"JetBrains Mono","SF Mono",Consolas,monospace;
    line-height:1.55;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  header .logo{ color:var(--amber); font-weight:bold; font-size:15px; display:flex; align-items:center; gap:8px; text-decoration:none; }
  header .logo::before{ content:"◆"; }
  #langRow{ display:flex; gap:6px; flex-wrap:wrap; }
  #langRow button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:3px; padding:5px 10px; font-family:inherit; font-size:12px; cursor:pointer;
  }
  #langRow button.active{ background:var(--amber); color:#111; border-color:var(--amber); font-weight:bold; }

  main{ max-width:760px; margin:0 auto; padding:20px 16px 60px; }

  nav#toc{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; margin-bottom:24px;
  }
  nav#toc h2{ margin:0 0 10px; color:var(--amber); font-size:13px; text-transform:uppercase; letter-spacing:1px; }
  nav#toc ol{ margin:0; padding-left:20px; columns:2; column-gap:20px; }
  nav#toc li{ margin-bottom:4px; font-size:13px; }
  nav#toc a{ color:var(--text); text-decoration:none; border-bottom:1px dotted var(--line); }
  nav#toc a:hover{ color:var(--amber); border-color:var(--amber); }

  section{ margin-bottom:36px; scroll-margin-top:70px; }
  section h2{
    color:var(--amber); font-size:17px; margin:0 0 10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  section h2 .num{ color:var(--rust); font-size:14px; }
  section p{ margin:0 0 12px; font-size:14px; color:var(--text); }
  section figure{ margin:14px 0; text-align:center; }
  section figure img{
    max-width:100%; border:1px solid var(--line); border-radius:6px;
    background:#0d0f09; image-rendering:pixelated;
  }
  section figure figcaption{ font-size:11px; color:#8a9080; margin-top:6px; }

  footer{
    text-align:center; padding:24px 16px; color:#6a7060; font-size:12px;
    border-top:1px solid var(--line);
  }
  footer a{ color:var(--amber); }

  #backTop{
    position:fixed; right:16px; bottom:16px; z-index:15;
    background:var(--panel2); color:var(--amber); border:1px solid var(--amber);
    border-radius:50%; width:42px; height:42px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  @media (max-width:520px){
    nav#toc ol{ columns:1; }
    header{ padding:8px 10px; }
    header .logo{ font-size:13px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">TileWeaver</a>
  <div id="langRow"></div>
</header>

<main>
  <nav id="toc"></nav>
  <div id="content"></div>
</main>

<button id="backTop" title="Up">↑</button>

<footer>
  TileWeaver — <span id="footerText">Free Isometric Tile Map Editor</span> · <a href="/">tileweaver.online</a>
</footer>

<script>
var TR = {"ua": {"nav_title": "Зміст", "page_title": "TileWeaver — Довідка", "intro_title": "Що таке TileWeaver", "intro_body": ["TileWeaver — безкоштовний браузерний редактор ізометричних тайлових карт для 2D-ігор. Завантажуєш свої текстури, розставляєш їх на карті, працюєш із шарами й колізіями, і експортуєш усе в JSON, який потім читає твоя гра.", "Працює повністю в браузері, нічого не встановлюється. Проєкт зберігається локально у твоєму браузері (localStorage), тому можна закрити вкладку і повернутись пізніше — все на місці."], "tiles_title": "Текстури й папки", "tiles_body": ["Кнопка \"+\" у верхньому ряду завантажує зображення як нову текстуру (тайл). Обраний тайл підсвічується жовтою рамкою — саме він ставиться на карту інструментом \"Ставити\".", "Над палітрою — рядок ПАПОК. Кожна текстура належить одній папці; відкрита папка визначає, що показано в палітрі нижче. Кнопка \"+\" в кінці рядка папок створює нову. Довге утримання (2 секунди) на назві папки відкриває меню перейменування/видалення — при видаленні текстури НЕ губляться, вони переїжджають у запасну папку.", "Довге утримання (пів секунди) на самій текстурі відкриває вікно редагування: перейменування, видалення, або налаштування анімації (див. розділ \"Анімовані тайли\")."], "place_title": "Інструмент \"Ставити\"", "place_body": ["Найпростіший інструмент: обери текстуру в палітрі, тапни по карті — тайл зʼявиться там, прив'язаний до сітки (якщо увімкнена \"Прив'язка\" знизу). Кожен новий тайл лягає на активний шар."], "select_title": "Інструмент \"Виділити\" — робота з групою", "select_body": ["Тягни пальцем по порожньому місцю карти — з'явиться рамка виділення. Все, що потрапило в неї на АКТИВНОМУ шарі, стає груповим виділенням, і зверху зʼявляється панель дій.", "Кнопки на панелі: 👁 сховати/перетягнути панель, Копіювати — в буфер обміну (потім Ctrl+V або кнопка \"Вставити\"), Рука (Тягнути) — перемикає на інструмент \"Рука\" щоб одразу тягнути всю групу разом, 🖨 Штамп — зберігає групу як штамп для повторного розміщення багатьма тапами поспіль (не переміщує оригінал, створює нові копії), ▧ Автотайлінг — застосовує налаштовану автопідстановку перехідних тайлів (див. відповідний розділ), 🗑 — видалити всю групу (з підтвердженням)."], "pan_title": "Інструмент \"Рука\" — переміщення й дії з обʼєктом", "pan_body": ["Тапни по обʼєкту — з'явиться панель дій і кутові ручки для зміни розміру. Тягни за сам обʼєкт, щоб перемістити його; тягни за кутову ручку, щоб змінити розмір.", "На панелі: Порядок — число z-глибини (можна ввести вручну), ↔ дзеркало по горизонталі, ↕ дзеркало по вертикалі, ↻ обертання, 🌑 тінь-силует (краще для дерев), ⬭ тінь-еліпс (краще для будинків), 🔓 заблокувати обʼєкт, Копіювати, 🗑 видалити.", "Заблокований обʼєкт (кнопка 🔓 → 🔒) не можна випадково зачепити: тягнути, масштабувати, видаляти — усе недоступне, поки не розблокуєш (з підтвердженням, щоб не знялось випадково)."], "pan2_title": "Заблокований обʼєкт", "pan2_body": ["Якщо обʼєкт заблокований, панель дій показує тільки одну кнопку — \"🔒 Розблокувати\". Це навмисно: заблокований обʼєкт має бути повністю захищений від випадкових змін, доки ти сам свідомо не вирішиш його розблокувати."], "shadow_title": "Тінь", "shadow_body": ["Дві кнопки тіні на панелі \"Рука\" створюють окремий обʼєкт-тінь під вибраним тайлом. 🌑 (силует) бере реальний контур спрайту — чудово для дерев, кущів, усього округлого. ⬭ (еліпс) — проста м'яка овальна пляма, ігнорує форму спрайту — краще підходить для будинків, парканів і всього прямокутного, де силует-тінь виглядала б дивно.", "Тінь одразу після створення готова до переміщення — інструмент сам перемикається на \"Руку\"."], "collision_title": "Колізії", "collision_body": ["Інструмент \"Колізії\" малює невидимі в грі зони (для перевірки зіткнень персонажа зі стінами тощо). Обери форму (Квадрат/Круг) і намалюй її протягуванням пальця.", "Тап на вже намальовану колізію (навіть в інструменті \"Колізії\") одразу вибирає її і дозволяє тягнути. Панель дій для колізії має ті самі можливості, що й для звичайного обʼєкта: копіювати, блокувати, видаляти — тіні й z-порядку колізіям не потрібно, це просто форми."], "clone_title": "Клон — заливка кількох тайлів за раз", "clone_body": ["Чотири під-режими зверху: Лінія — тапаєш точку, обираєш напрямок стрілкою і кількість, тайли лягають рядком. Заповнити □ — тягнеш прямокутник, заповнюється весь. Заповнити ◇ — те саме, ромбом (зручно для ізометричних \"кіл\"). Штамп — четвертий режим, активується автоматично після натискання кнопки 🖨 Штамп на панелі групового виділення; кожен тап ставить копію всієї збереженої групи."], "layers_title": "Шари", "layers_body": ["Шари йдуть зліва направо в порядку створення. Кнопка \"+\" додає новий шар (він завжди зверху за z-порядком). Тап на назву шару робить його активним — усі нові тайли лягають саме на нього."], "layers2_title": "Меню шару (шестерня)", "layers2_body": ["Заблокувати — весь шар стає недоторканим. Перейменувати. Підняти/Опустити — змінює порядок малювання шару відносно інших. Змінити глибину — вручну ввести число z. Об'єднати видимі — зливає всі видимі шари в один, зберігаючи взаємний порядок обʼєктів. Видалити шар — видаляє шар і ВСІ обʼєкти на ньому (з підтвердженням)."], "autotile_title": "Автотайлінг", "autotile_body": ["Дозволяє автоматично підставляти перехідні тайли на межі двох матеріалів (наприклад трава/пісок), замість вручну підбирати кожен стик.", "Налаштування: Меню → Автотайлінг → Нова група. Сітка 3×3: чотири кути — це чотири різні матеріали (тайли-джерела), чотири краї між ними — перехідні тайли для стику двох сусідніх по колу матеріалів. Тапаєш клітинку — обираєш тайл з палітри.", "Застосування: інструментом \"Виділити\" виділяєш ділянку карти → на панелі виділення тисни \"▧ Автотайлінг\" → на всій виділеній площі, де стоять тайли з групи, автоматично підставляться потрібні краєві варіанти."], "animation_title": "Анімовані тайли", "animation_body": ["Текстура може бути анімованою: горизонтальна смуга кадрів в одному PNG-файлі (стандартний формат, підтримується більшістю пікс-арт редакторів при експорті \"Sprite Sheet\").", "Довге утримання на тайлі → вмикаєш чекбокс \"Це анімація\" → вказуєш кількість кадрів у смузі й швидкість у мілісекундах на кадр → зберігаєш. Тайл одразу почне анімуватись прямо в редакторі."], "minimap_title": "Мінімапа", "minimap_body": ["Маленька оглядова карта в лівому верхньому куті, вмикається через Меню → Мінімапа. Показує розташування всіх обʼєктів і рамку поточного видимого вікна.", "Тап по мінімапі відкриває велику модалку на весь екран — там можна плавно погортати превʼю, наблизити (+/− або колесо миші), і натиснути \"Перейти сюди\", щоб основна карта переміщалась туди."], "hotkeys_title": "Гарячі клавіші (для комп'ютера)", "hotkeys_body": ["Delete / Backspace — видалити виділене. Ctrl+C / Ctrl+V — копіювати / вставити. Ctrl+Z — скасувати останню дію. Escape — зняти виділення. Стрілки — точний зсув на 1 піксель, з Shift — на 10."], "undo_title": "Скасувати дію", "undo_body": ["Кнопка \"Скасувати\" в нижній панелі повертає на крок назад практично будь-яку дію: розміщення, видалення, переміщення, зміну шару. Історія тримає до 40 останніх кроків."], "export_title": "Проєкти, файли й імпорт спрайтшита", "export_body": ["Меню → Проєкти дозволяє створювати кілька окремих карт і перемикатись між ними. Меню → Файл — зберегти поточну карту у файл на пристрій або завантажити раніше збережений файл.", "Меню → Імпорт спрайтшита — завантажуєш один великий аркуш із багатьма текстурами і ріжеш його на окремі тайли трьома способами: рівномірна сітка (вказуєш розмір клітинки/кількість колонок і рядків), вручну (тягнеш прямокутник навколо потрібного шматка), або \"розумна нарізка\" (алгоритм сам знаходить межі окремих малюнків за прозорістю фону)."]}, "en": {"nav_title": "Contents", "page_title": "TileWeaver — Help", "intro_title": "What is TileWeaver", "intro_body": ["TileWeaver is a free browser-based isometric tile map editor for 2D games. Upload your own textures, place them on the map, work with layers and collisions, and export everything as JSON for your game to read.", "It runs entirely in the browser — nothing to install. Your project is saved locally in your browser (localStorage), so you can close the tab and come back later; everything stays in place."], "tiles_title": "Textures and folders", "tiles_body": ["The \"+\" button in the top row uploads an image as a new texture (tile). The selected tile is highlighted with a yellow border — that's the one the \"Place\" tool uses.", "Above the palette is a row of FOLDERS. Every texture belongs to exactly one folder; the currently open folder decides what's shown in the palette below. The \"+\" at the end of the folder row creates a new one. Holding a folder name for 2 seconds opens a rename/delete menu — deleting a folder never deletes its textures, they simply move to the fallback folder.", "Holding down on a texture itself (half a second) opens the edit window: rename, delete, or set up animation (see \"Animated tiles\")."], "place_title": "The \"Place\" tool", "place_body": ["The simplest tool: pick a texture in the palette, tap the map — the tile appears there, snapped to the grid (if \"Snap\" is enabled at the bottom). Every new tile goes onto the active layer."], "select_title": "The \"Select\" tool — working with a group", "select_body": ["Drag your finger across empty map space to draw a selection box. Everything it covers on the ACTIVE layer becomes a group selection, and an action panel appears above it.", "Panel buttons: 👁 hide/drag the panel itself, Copy — to the clipboard (then Ctrl+V or the Paste button), Hand (Drag) — switches to the \"Pan\" tool so you can drag the whole group at once, 🖨 Stamp — saves the group as a reusable stamp for placing many copies with repeated taps (the original stays put; each tap creates a new copy), ▧ Autotile — applies your configured edge-tile auto-substitution (see that section), 🗑 — delete the whole group (with confirmation)."], "pan_title": "The \"Pan\" tool — moving and acting on an object", "pan_body": ["Tap an object to see its action panel and corner resize handles. Drag the object itself to move it; drag a corner handle to resize it.", "On the panel: Order — the z-depth number (can be typed manually), ↔ flip horizontally, ↕ flip vertically, ↻ rotate, 🌑 silhouette shadow (best for trees), ⬭ oval shadow (best for buildings), 🔓 lock the object, Copy, 🗑 delete.", "A locked object (🔓 → 🔒) can't be bumped by accident: dragging, resizing, deleting — all disabled until you unlock it (with a confirmation, so it can't come undone by mistake either)."], "pan2_title": "A locked object", "pan2_body": ["When an object is locked, the action panel shows only one button — \"🔒 Unlock\". That's intentional: a locked object should be fully protected from accidental changes until you deliberately decide to unlock it."], "shadow_title": "Shadow", "shadow_body": ["The two shadow buttons on the \"Pan\" panel create a separate shadow object beneath the selected tile. 🌑 (silhouette) traces the sprite's actual outline — great for trees, bushes, anything rounded. ⬭ (oval) is a simple soft oval blob that ignores the sprite's shape entirely — better for buildings, fences, and anything rectangular where a silhouette shadow would look odd.", "A shadow is immediately ready to be moved after creation — the tool switches to \"Pan\" automatically."], "collision_title": "Collisions", "collision_body": ["The \"Collision\" tool draws invisible-in-game zones (for checking whether a character bumps into a wall, for example). Pick a shape (Square/Circle) and draw it by dragging.", "Tapping an already-drawn collision (even while the \"Collision\" tool is active) selects it right away and lets you drag it. Its action panel has the same capabilities as a regular object: copy, lock, delete — collisions don't need shadows or z-order, they're just shapes."], "clone_title": "Clone — placing many tiles at once", "clone_body": ["Four sub-modes at the top: Line — tap a point, pick a direction with the arrow and a count, tiles lay down in a row. Fill □ — drag a rectangle, it fills completely. Fill ◇ — same, but diamond-shaped (handy for isometric \"circles\"). Stamp — a fourth mode, activated automatically after pressing 🖨 Stamp on the group-selection panel; every tap places a copy of the whole saved group."], "layers_title": "Layers", "layers_body": ["Layers run left to right in creation order. The \"+\" button adds a new layer (it's always on top in z-order). Tapping a layer's name makes it active — every new tile goes onto it."], "layers2_title": "Layer menu (the gear icon)", "layers2_body": ["Lock — the whole layer becomes untouchable. Rename. Raise/Lower — changes this layer's draw order relative to others. Change depth — type a z number manually. Merge visible — combines all visible layers into one, preserving the relative order of every object. Delete layer — removes the layer and ALL objects on it (with confirmation)."], "autotile_title": "Autotiling", "autotile_body": ["Automatically substitutes transition tiles at the boundary between two materials (say, grass/sand) instead of you picking each seam by hand.", "Setup: Menu → Autotiling → New group. A 3×3 grid: the four corners are four different materials (source tiles), the four edges between them are the transition tiles for the seam between two adjacent (going around the circle) materials. Tap a cell to pick a tile from the palette.", "Applying it: use the \"Select\" tool to select an area of the map → on the selection panel press \"▧ Autotile\" → anywhere within the selection where tiles from that group sit, the correct edge tiles get substituted automatically."], "animation_title": "Animated tiles", "animation_body": ["A texture can be animated: a horizontal strip of frames in a single PNG file (a standard format most pixel-art tools support as a \"Sprite Sheet\" export).", "Hold down on a tile → check \"This is an animation\" → set the number of frames in the strip and the speed in milliseconds per frame → save. The tile starts animating right there in the editor."], "minimap_title": "Minimap", "minimap_body": ["A small overview map in the top-left corner, toggled via Menu → Minimap. Shows where every object sits and a frame for the currently visible viewport.", "Tapping the minimap opens a full-screen modal — you can smoothly pan the preview around, zoom (+/− or the mouse wheel), and press \"Go here\" to move the main map there."], "hotkeys_title": "Keyboard shortcuts (desktop)", "hotkeys_body": ["Delete / Backspace — delete the selection. Ctrl+C / Ctrl+V — copy / paste. Ctrl+Z — undo the last action. Escape — clear selection. Arrow keys — nudge by 1 pixel, hold Shift for 10."], "undo_title": "Undo", "undo_body": ["The \"Undo\" button in the bottom bar steps back through almost any action: placing, deleting, moving, changing a layer. History holds up to 40 recent steps."], "export_title": "Projects, files, and sprite sheet import", "export_body": ["Menu → Projects lets you create several separate maps and switch between them. Menu → File — save the current map to a file on your device, or load a previously saved file.", "Menu → Sprite sheet import — upload one large sheet containing many textures and slice it into individual tiles three ways: an even grid (set cell size or column/row count), manually (drag a rectangle around the piece you need), or \"smart slicing\" (an algorithm finds the boundaries of individual drawings by background transparency on its own)."]}, "zh": {"nav_title": "目录", "page_title": "TileWeaver — 帮助", "intro_title": "什么是 TileWeaver", "intro_body": ["TileWeaver 是一款免费的基于浏览器的等距瓦片地图编辑器，适用于 2D 游戏。上传你自己的贴图，将它们放置到地图上，使用图层和碰撞体，并将一切导出为 JSON，供你的游戏读取。", "完全在浏览器中运行，无需安装任何东西。项目会保存在浏览器本地（localStorage），所以你可以关闭标签页，之后再回来——一切都还在原处。"], "tiles_title": "贴图与文件夹", "tiles_body": ["顶部一行的“+”按钮用于上传图片作为新的贴图（瓦片）。当前选中的瓦片会用黄色边框高亮——“放置”工具使用的就是它。", "调色板上方是一排“文件夹”。每个贴图只属于一个文件夹；当前打开的文件夹决定下方调色板显示哪些内容。文件夹行末尾的“+”用于新建文件夹。长按文件夹名称（2秒）会打开重命名/删除菜单——删除文件夹并不会删除其中的贴图，它们会被移到备用文件夹中。", "长按贴图本身（约半秒）会打开编辑窗口：重命名、删除，或设置动画（见“动画瓦片”一节）。"], "place_title": "“放置”工具", "place_body": ["最简单的工具：在调色板中选一个贴图，点击地图——瓦片就会出现在那里，并自动吸附到网格（如果底部启用了“吸附”）。每个新瓦片都会放到当前激活的图层上。"], "select_title": "“选择”工具 — 群组操作", "select_body": ["在地图空白处拖动手指画出一个选框。当前激活图层上被框住的所有内容都会成为一个群组选区，上方会出现操作面板。", "面板按钮：👁 隐藏/拖动面板本身，复制——复制到剪贴板（之后可用 Ctrl+V 或“粘贴”按钮），手（拖动）——切换到“平移”工具以便一次性拖动整个群组，🖨 图章——将该群组保存为可重复放置的图章，之后每次点击都会放置一份新副本（原始群组保持不动，每次点击都是全新的一份），▧ 自动拼贴——应用你配置好的边缘瓦片自动替换（见对应章节），🗑 ——删除整个群组（需要确认）。"], "pan_title": "“平移”工具 — 移动对象与操作", "pan_body": ["点击一个对象即可看到它的操作面板和四角的缩放手柄。拖动对象本身可以移动它；拖动角上的手柄可以调整大小。", "面板上：顺序——z 深度数值（可手动输入），↔ 水平镜像，↕ 垂直镜像，↻ 旋转，🌑 剪影阴影（更适合树木），⬭ 椭圆阴影（更适合建筑物），🔓 锁定对象，复制，🗑 删除。", "被锁定的对象（🔓 → 🔒）不会被意外触碰：拖动、缩放、删除全部被禁用，直到你解锁它为止（解锁需要确认，避免被误触取消锁定）。"], "pan2_title": "被锁定的对象", "pan2_body": ["当一个对象被锁定时，操作面板只会显示一个按钮——“🔒 解锁”。这是有意为之：被锁定的对象应该完全免受意外改动的影响，直到你自己主动决定解锁它。"], "shadow_title": "阴影", "shadow_body": ["“平移”面板上的两个阴影按钮会在所选瓦片下方创建一个独立的阴影对象。🌑（剪影）会沿着精灵图的实际轮廓生成——非常适合树木、灌木等圆润的物体。⬭（椭圆）是一个简单的柔和椭圆形色块，完全不考虑精灵图的形状——更适合建筑物、栅栏等矩形物体，用剪影阴影反而会显得很奇怪。", "阴影创建后会立即可以移动——工具会自动切换到“平移”。"], "collision_title": "碰撞体", "collision_body": ["“碰撞体”工具用于绘制游戏中不可见的区域（例如用于检测角色是否撞到墙壁）。选择一种形状（方形/圆形），拖动即可绘制。", "点击一个已经画好的碰撞体（即使当前正处于“碰撞体”工具中）会立即选中它并允许拖动。碰撞体的操作面板具有与普通对象相同的功能：复制、锁定、删除——碰撞体不需要阴影或 z 顺序，它们只是纯粹的形状。"], "clone_title": "克隆 — 一次放置多个瓦片", "clone_body": ["顶部有四种子模式：直线——点击一个点，用箭头选择方向和数量，瓦片会排成一行。填充 □——拖出一个矩形，整个区域都会被填满。填充 ◇——同上，但是菱形（适合等距视角下的“圆形”区域）。图章——第四种模式，在群组选区面板上点击 🖨 图章后自动激活；之后每次点击都会放置一份已保存群组的副本。"], "layers_title": "图层", "layers_body": ["图层按创建顺序从左到右排列。“+”按钮用于添加新图层（在 z 顺序中始终位于最上层）。点击图层名称可将其设为当前激活图层——所有新瓦片都会放置在该图层上。"], "layers2_title": "图层菜单（齿轮图标）", "layers2_body": ["锁定——整个图层变为不可触碰。重命名。上移/下移——更改该图层相对于其他图层的绘制顺序。修改深度——手动输入 z 数值。合并可见图层——将所有可见图层合并为一个，同时保留所有对象之间的相对顺序。删除图层——删除该图层及其上的所有对象（需要确认）。"], "autotile_title": "自动拼贴", "autotile_body": ["可以在两种材质的交界处（例如草地/沙地）自动替换为过渡瓦片，而不需要你手动逐一挑选每个接缝处的瓦片。", "设置方法：菜单 → 自动拼贴 → 新建组。3×3 网格：四个角代表四种不同的材质（源瓦片），它们之间的四条边则是相邻两种材质（沿环绕一圈计算）交界处所用的过渡瓦片。点击某个格子即可从调色板中选择对应的瓦片。", "应用方法：使用“选择”工具框选地图的一个区域 → 在选区面板上点击“▧ 自动拼贴” → 在所选区域内，凡是放置了该组瓦片的地方，都会自动替换为正确的边缘过渡瓦片。"], "animation_title": "动画瓦片", "animation_body": ["贴图可以是动画的：将多帧横向排列在同一张 PNG 图片中（大多数像素画工具在导出“Sprite Sheet”时都支持这种标准格式）。", "长按某个瓦片 → 勾选“这是一个动画” → 设置图片条中的帧数以及每帧的播放速度（毫秒）→ 保存。瓦片会立即在编辑器中开始播放动画。"], "minimap_title": "小地图", "minimap_body": ["位于左上角的小型概览地图，通过 菜单 → 小地图 开启。显示所有对象的位置，以及当前可见视口的边框。", "点击小地图会打开一个全屏弹窗——你可以在其中流畅地拖动预览、缩放（+/− 或鼠标滚轮），然后点击“跳转到这里”，让主地图移动到该位置。"], "hotkeys_title": "快捷键（电脑端）", "hotkeys_body": ["Delete / Backspace — 删除所选内容。Ctrl+C / Ctrl+V — 复制 / 粘贴。Ctrl+Z — 撤销上一步操作。Escape — 取消选择。方向键 — 微调 1 像素，按住 Shift 则为 10 像素。"], "undo_title": "撤销操作", "undo_body": ["底部工具栏中的“撤销”按钮几乎可以回退任何操作：放置、删除、移动、更改图层。历史记录最多保留最近 40 步。"], "export_title": "项目、文件与精灵图导入", "export_body": ["菜单 → 项目 允许你创建多张独立的地图并在它们之间切换。菜单 → 文件 —— 将当前地图保存为设备上的文件，或加载之前保存的文件。", "菜单 → 精灵图导入 —— 上传一张包含许多贴图的大图，并用三种方式将其切割为独立的瓦片：均匀网格（设置格子大小或行列数）、手动（拖出一个矩形框选所需部分），或“智能切割”（算法根据背景透明度自动识别每个图案的边界）。"]}, "ko": {"nav_title": "목차", "page_title": "TileWeaver — 도움말", "intro_title": "TileWeaver란?", "intro_body": ["TileWeaver는 2D 게임을 위한 무료 브라우저 기반 아이소메트릭 타일맵 에디터입니다. 원하는 텍스처를 업로드하고, 맵에 배치하고, 레이어와 충돌 영역을 다루고, 게임에서 읽을 수 있도록 JSON으로 내보낼 수 있습니다.", "완전히 브라우저 안에서 동작하며 설치가 필요 없습니다. 프로젝트는 브라우저 로컬(localStorage)에 저장되므로 탭을 닫았다가 나중에 다시 열어도 모든 내용이 그대로 남아 있습니다."], "tiles_title": "텍스처와 폴더", "tiles_body": ["상단 줄의 \"+\" 버튼으로 이미지를 새 텍스처(타일)로 업로드합니다. 선택된 타일은 노란 테두리로 표시되며, \"놓기\" 도구가 사용하는 것이 바로 이 타일입니다.", "팔레트 위쪽에는 폴더 줄이 있습니다. 각 텍스처는 하나의 폴더에만 속하며, 현재 열려 있는 폴더가 아래 팔레트에 무엇을 보여줄지 결정합니다. 폴더 줄 끝의 \"+\"로 새 폴더를 만듭니다. 폴더 이름을 2초간 길게 누르면 이름 변경/삭제 메뉴가 열립니다 — 폴더를 삭제해도 안의 텍스처는 사라지지 않고 예비 폴더로 이동합니다.", "타일 자체를 0.5초 정도 길게 누르면 편집 창이 열립니다: 이름 변경, 삭제, 또는 애니메이션 설정(\"애니메이션 타일\" 항목 참고)."], "place_title": "\"놓기\" 도구", "place_body": ["가장 단순한 도구: 팔레트에서 텍스처를 고르고 맵을 탭하면 타일이 그 자리에 나타납니다(하단의 \"스냅\"이 켜져 있으면 격자에 맞춰짐). 새 타일은 항상 활성 레이어에 놓입니다."], "select_title": "\"선택\" 도구 — 그룹 작업", "select_body": ["맵의 빈 공간을 손가락으로 드래그하면 선택 상자가 그려집니다. 활성 레이어에서 그 안에 들어온 모든 것이 그룹 선택이 되고, 위쪽에 작업 패널이 나타납니다.", "패널 버튼: 👁 패널 숨기기/드래그, 복사 — 클립보드로 복사(이후 Ctrl+V 또는 \"붙여넣기\" 버튼 사용), 손(드래그) — \"이동\" 도구로 전환해 그룹 전체를 한 번에 드래그, 🖨 스탬프 — 그룹을 재사용 가능한 스탬프로 저장하여 이후 탭할 때마다 새 사본을 배치(원본은 그대로 남고, 탭할 때마다 새 사본이 생성됨), ▧ 자동 타일링 — 설정해 둔 경계 타일 자동 치환을 적용(해당 항목 참고), 🗑 — 그룹 전체 삭제(확인 필요)."], "pan_title": "\"이동\" 도구 — 오브젝트 이동 및 조작", "pan_body": ["오브젝트를 탭하면 작업 패널과 모서리 크기 조절 핸들이 나타납니다. 오브젝트 자체를 드래그하면 이동, 모서리 핸들을 드래그하면 크기 조절이 됩니다.", "패널: 순서 — z-깊이 수치(직접 입력 가능), ↔ 좌우 반전, ↕ 상하 반전, ↻ 회전, 🌑 실루엣 그림자(나무에 적합), ⬭ 타원 그림자(건물에 적합), 🔓 오브젝트 잠금, 복사, 🗑 삭제.", "잠긴 오브젝트(🔓 → 🔒)는 실수로 건드릴 수 없습니다: 드래그, 크기 조절, 삭제가 모두 비활성화되며, 잠금을 해제해야만 다시 가능해집니다(실수로 풀리지 않도록 확인 절차가 있습니다)."], "pan2_title": "잠긴 오브젝트", "pan2_body": ["오브젝트가 잠기면 작업 패널에는 \"🔒 잠금 해제\" 버튼 하나만 표시됩니다. 이는 의도된 것으로, 잠긴 오브젝트는 사용자가 직접 잠금 해제를 결정하기 전까지 실수로 인한 변경으로부터 완전히 보호되어야 하기 때문입니다."], "shadow_title": "그림자", "shadow_body": ["\"이동\" 패널의 두 그림자 버튼은 선택한 타일 아래에 별도의 그림자 오브젝트를 생성합니다. 🌑(실루엣)은 스프라이트의 실제 윤곽선을 따라 생성됩니다 — 나무, 덤불처럼 둥근 형태에 적합합니다. ⬭(타원)은 스프라이트의 모양을 무시하는 단순하고 부드러운 타원형 얼룩입니다 — 실루엣 그림자가 어색해 보이는 건물, 울타리 같은 사각형 물체에 더 적합합니다.", "그림자는 생성 즉시 이동할 준비가 됩니다 — 도구가 자동으로 \"이동\"으로 전환됩니다."], "collision_title": "충돌 영역", "collision_body": ["\"충돌\" 도구는 게임 내에서 보이지 않는 영역을 그립니다(예: 캐릭터가 벽에 부딪히는지 확인용). 모양(사각형/원)을 고르고 드래그해서 그립니다.", "이미 그려진 충돌 영역을 탭하면(\"충돌\" 도구가 활성화된 상태에서도) 즉시 선택되어 바로 드래그할 수 있습니다. 충돌 영역의 작업 패널은 일반 오브젝트와 동일한 기능을 가집니다: 복사, 잠금, 삭제 — 충돌 영역은 형태일 뿐이므로 그림자나 z-순서가 필요 없습니다."], "clone_title": "복제 — 한 번에 여러 타일 배치", "clone_body": ["상단에 네 가지 하위 모드: 라인 — 점을 탭하고 화살표로 방향과 개수를 정하면 타일이 한 줄로 놓입니다. 채우기 □ — 사각형을 드래그하면 전체가 채워집니다. 채우기 ◇ — 동일하지만 다이아몬드 형태(아이소메트릭 \"원\"에 유용). 스탬프 — 그룹 선택 패널에서 🖨 스탬프를 누르면 자동으로 활성화되는 네 번째 모드; 탭할 때마다 저장된 그룹 전체의 사본이 배치됩니다."], "layers_title": "레이어", "layers_body": ["레이어는 생성된 순서대로 왼쪽에서 오른쪽으로 나열됩니다. \"+\" 버튼으로 새 레이어를 추가합니다(z-순서상 항상 맨 위). 레이어 이름을 탭하면 활성 레이어가 되며, 새 타일은 모두 그 위에 놓입니다."], "layers2_title": "레이어 메뉴(톱니바퀴 아이콘)", "layers2_body": ["잠금 — 레이어 전체가 건드릴 수 없게 됩니다. 이름 변경. 올리기/내리기 — 다른 레이어에 대한 이 레이어의 그리기 순서를 변경. 깊이 변경 — z 값을 직접 입력. 보이는 레이어 병합 — 보이는 모든 레이어를 하나로 합치되, 모든 오브젝트의 상대적 순서는 유지. 레이어 삭제 — 레이어와 그 위의 모든 오브젝트를 삭제(확인 필요)."], "autotile_title": "자동 타일링", "autotile_body": ["두 재질의 경계(예: 잔디/모래)에 매번 손으로 접합부를 고르는 대신 전환 타일을 자동으로 대체해 줍니다.", "설정: 메뉴 → 자동 타일링 → 새 그룹. 3×3 격자: 네 모서리는 네 가지 서로 다른 재질(원본 타일)이고, 그 사이의 네 변은 원형으로 인접한 두 재질 사이 접합부에 쓰이는 전환 타일입니다. 칸을 탭해서 팔레트에서 타일을 고릅니다.", "적용: \"선택\" 도구로 맵의 영역을 선택 → 선택 패널에서 \"▧ 자동 타일링\" 클릭 → 선택 영역 안에서 해당 그룹의 타일이 놓인 모든 곳에 알맞은 전환 타일이 자동으로 적용됩니다."], "animation_title": "애니메이션 타일", "animation_body": ["텍스처는 애니메이션이 될 수 있습니다: 하나의 PNG 파일 안에 프레임이 가로로 나열된 형태(대부분의 픽셀 아트 도구가 \"Sprite Sheet\"로 내보낼 때 지원하는 표준 형식).", "타일을 길게 누르기 → \"애니메이션임\" 체크 → 스트립 안의 프레임 수와 프레임당 속도(밀리초)를 설정 → 저장. 타일이 에디터 안에서 바로 애니메이션을 시작합니다."], "minimap_title": "미니맵", "minimap_body": ["왼쪽 상단의 작은 개요 지도로, 메뉴 → 미니맵으로 켤 수 있습니다. 모든 오브젝트의 위치와 현재 보이는 화면의 테두리를 보여줍니다.", "미니맵을 탭하면 전체 화면 모달이 열립니다 — 미리보기를 부드럽게 이동시키고(확대는 +/− 또는 마우스 휠), \"여기로 이동\"을 눌러 메인 맵을 그 위치로 옮길 수 있습니다."], "hotkeys_title": "단축키(데스크톱)", "hotkeys_body": ["Delete / Backspace — 선택 항목 삭제. Ctrl+C / Ctrl+V — 복사 / 붙여넣기. Ctrl+Z — 마지막 작업 취소. Escape — 선택 해제. 방향키 — 1픽셀 미세 이동, Shift를 누르면 10픽셀."], "undo_title": "실행 취소", "undo_body": ["하단 바의 \"실행 취소\" 버튼은 배치, 삭제, 이동, 레이어 변경 등 거의 모든 작업을 한 단계씩 되돌립니다. 기록은 최근 40단계까지 보관됩니다."], "export_title": "프로젝트, 파일, 스프라이트 시트 가져오기", "export_body": ["메뉴 → 프로젝트에서 여러 개의 독립된 맵을 만들고 전환할 수 있습니다. 메뉴 → 파일 — 현재 맵을 기기에 파일로 저장하거나, 이전에 저장한 파일을 불러옵니다.", "메뉴 → 스프라이트 시트 가져오기 — 여러 텍스처가 담긴 큰 시트 하나를 업로드하고 세 가지 방법으로 개별 타일로 자릅니다: 균등 격자(칸 크기나 열/행 수 지정), 수동(필요한 부분 주위에 사각형을 드래그), 또는 \"스마트 슬라이싱\"(알고리즘이 배경 투명도를 기준으로 개별 그림의 경계를 스스로 찾음)."]}, "de": {"nav_title": "Inhalt", "page_title": "TileWeaver — Hilfe", "intro_title": "Was ist TileWeaver", "intro_body": ["TileWeaver ist ein kostenloser, browserbasierter isometrischer Tile-Map-Editor für 2D-Spiele. Lade eigene Texturen hoch, platziere sie auf der Karte, arbeite mit Ebenen und Kollisionen, und exportiere alles als JSON, das dein Spiel einlesen kann.", "Läuft vollständig im Browser, nichts muss installiert werden. Das Projekt wird lokal im Browser gespeichert (localStorage) — du kannst den Tab schließen und später zurückkommen, alles bleibt erhalten."], "tiles_title": "Texturen und Ordner", "tiles_body": ["Die \"+\"-Schaltfläche in der oberen Zeile lädt ein Bild als neue Textur (Tile) hoch. Das ausgewählte Tile ist gelb umrandet — genau dieses verwendet das Werkzeug \"Platzieren\".", "Über der Palette befindet sich eine Zeile mit ORDNERN. Jede Textur gehört zu genau einem Ordner; der gerade geöffnete Ordner bestimmt, was in der Palette darunter angezeigt wird. Das \"+\" am Ende der Ordnerzeile legt einen neuen Ordner an. Zwei Sekunden langes Halten eines Ordnernamens öffnet ein Menü zum Umbenennen/Löschen — beim Löschen eines Ordners gehen die Texturen NICHT verloren, sie wandern in den Ausweichordner.", "Langes Halten (eine halbe Sekunde) auf einer Textur selbst öffnet das Bearbeitungsfenster: umbenennen, löschen oder Animation einrichten (siehe \"Animierte Tiles\")."], "place_title": "Das Werkzeug \"Platzieren\"", "place_body": ["Das einfachste Werkzeug: Textur in der Palette wählen, auf die Karte tippen — das Tile erscheint dort, am Raster ausgerichtet (wenn \"Einrasten\" unten aktiviert ist). Jedes neue Tile landet auf der aktiven Ebene."], "select_title": "Das Werkzeug \"Auswählen\" — mit Gruppen arbeiten", "select_body": ["Ziehe mit dem Finger über eine leere Stelle der Karte, um einen Auswahlrahmen aufzuziehen. Alles, was darin auf der AKTIVEN Ebene liegt, wird zu einer Gruppenauswahl, und oben erscheint ein Aktionspanel.", "Schaltflächen im Panel: 👁 Panel ausblenden/verschieben, Kopieren — in die Zwischenablage (danach Strg+V oder die Schaltfläche \"Einfügen\"), Hand (Ziehen) — wechselt zum Werkzeug \"Verschieben\", um die ganze Gruppe auf einmal zu ziehen, 🖨 Stempel — speichert die Gruppe als wiederverwendbaren Stempel, mit dem jedes weitere Antippen eine neue Kopie platziert (das Original bleibt an Ort und Stelle, jedes Tippen erzeugt eine neue Kopie), ▧ Auto-Tiling — wendet die konfigurierte automatische Übergangs-Tile-Ersetzung an (siehe entsprechender Abschnitt), 🗑 — löscht die ganze Gruppe (mit Bestätigung)."], "pan_title": "Das Werkzeug \"Verschieben\" — Objekte bewegen und bearbeiten", "pan_body": ["Tippe auf ein Objekt, um sein Aktionspanel und die Eckgriffe zur Größenänderung zu sehen. Ziehe am Objekt selbst, um es zu verschieben; ziehe an einem Eckgriff, um die Größe zu ändern.", "Im Panel: Reihenfolge — die z-Tiefe als Zahl (kann manuell eingegeben werden), ↔ horizontal spiegeln, ↕ vertikal spiegeln, ↻ drehen, 🌑 Silhouetten-Schatten (am besten für Bäume), ⬭ ovaler Schatten (am besten für Gebäude), 🔓 Objekt sperren, Kopieren, 🗑 löschen.", "Ein gesperrtes Objekt (🔓 → 🔒) kann nicht versehentlich verändert werden: Ziehen, Skalieren, Löschen sind alle deaktiviert, bis du es entsperrst (mit Bestätigung, damit die Sperre nicht ebenso versehentlich aufgehoben wird)."], "pan2_title": "Ein gesperrtes Objekt", "pan2_body": ["Wenn ein Objekt gesperrt ist, zeigt das Aktionspanel nur eine Schaltfläche — \"🔒 Entsperren\". Das ist Absicht: Ein gesperrtes Objekt soll vollständig vor versehentlichen Änderungen geschützt sein, bis du bewusst entscheidest, es zu entsperren."], "shadow_title": "Schatten", "shadow_body": ["Die beiden Schatten-Schaltflächen im \"Verschieben\"-Panel erzeugen ein separates Schattenobjekt unter dem gewählten Tile. 🌑 (Silhouette) folgt dem tatsächlichen Umriss des Sprites — ideal für Bäume, Büsche, alles Runde. ⬭ (Oval) ist ein einfacher weicher ovaler Fleck, der die Form des Sprites komplett ignoriert — besser geeignet für Gebäude, Zäune und alles Rechteckige, wo ein Silhouetten-Schatten seltsam aussehen würde.", "Ein Schatten ist sofort nach dem Erstellen verschiebbar — das Werkzeug wechselt automatisch zu \"Verschieben\"."], "collision_title": "Kollisionen", "collision_body": ["Das Werkzeug \"Kollisionen\" zeichnet im Spiel unsichtbare Zonen (z. B. um zu prüfen, ob eine Figur gegen eine Wand stößt). Form wählen (Quadrat/Kreis) und durch Ziehen aufzeichnen.", "Ein Tippen auf eine bereits gezeichnete Kollision (auch bei aktivem Werkzeug \"Kollisionen\") wählt sie sofort aus und erlaubt das Ziehen. Das Aktionspanel einer Kollision bietet dieselben Möglichkeiten wie bei einem normalen Objekt: Kopieren, Sperren, Löschen — Kollisionen brauchen weder Schatten noch eine z-Reihenfolge, sie sind reine Formen."], "clone_title": "Klonen — mehrere Tiles auf einmal platzieren", "clone_body": ["Vier Untermodi oben: Linie — Punkt antippen, Richtung mit dem Pfeil und Anzahl wählen, die Tiles reihen sich auf. Füllen □ — ein Rechteck aufziehen, es wird vollständig gefüllt. Füllen ◇ — dasselbe, aber rautenförmig (praktisch für isometrische \"Kreise\"). Stempel — ein vierter Modus, der automatisch aktiviert wird, nachdem man 🖨 Stempel im Panel der Gruppenauswahl gedrückt hat; jedes Tippen platziert eine Kopie der gesamten gespeicherten Gruppe."], "layers_title": "Ebenen", "layers_body": ["Ebenen laufen in Erstellungsreihenfolge von links nach rechts. Die \"+\"-Schaltfläche fügt eine neue Ebene hinzu (sie liegt in der z-Reihenfolge immer ganz oben). Ein Tippen auf den Ebenennamen macht sie aktiv — jedes neue Tile landet genau darauf."], "layers2_title": "Ebenenmenü (Zahnrad-Symbol)", "layers2_body": ["Sperren — die ganze Ebene wird unantastbar. Umbenennen. Anheben/Absenken — ändert die Zeichenreihenfolge dieser Ebene relativ zu den anderen. Tiefe ändern — manuell eine z-Zahl eingeben. Sichtbare zusammenführen — vereint alle sichtbaren Ebenen zu einer, wobei die relative Reihenfolge aller Objekte erhalten bleibt. Ebene löschen — entfernt die Ebene und ALLE Objekte darauf (mit Bestätigung)."], "autotile_title": "Auto-Tiling", "autotile_body": ["Ersetzt automatisch Übergangs-Tiles an der Grenze zweier Materialien (z. B. Gras/Sand), statt jede Naht von Hand auszusuchen.", "Einrichtung: Menü → Auto-Tiling → Neue Gruppe. Ein 3×3-Raster: Die vier Ecken sind vier verschiedene Materialien (Quell-Tiles), die vier Kanten dazwischen sind die Übergangs-Tiles für die Naht zwischen zwei im Kreis benachbarten Materialien. Auf eine Zelle tippen wählt ein Tile aus der Palette.", "Anwendung: Mit dem Werkzeug \"Auswählen\" einen Kartenbereich auswählen → im Auswahlpanel \"▧ Auto-Tiling\" drücken → überall im ausgewählten Bereich, wo Tiles dieser Gruppe liegen, werden automatisch die passenden Übergangs-Tiles eingesetzt."], "animation_title": "Animierte Tiles", "animation_body": ["Eine Textur kann animiert sein: ein horizontaler Streifen aus Einzelbildern in einer einzigen PNG-Datei (ein Standardformat, das die meisten Pixel-Art-Programme beim Export als \"Sprite Sheet\" unterstützen).", "Auf ein Tile lange drücken → \"Das ist eine Animation\" ankreuzen → Anzahl der Frames im Streifen und Geschwindigkeit in Millisekunden pro Frame einstellen → speichern. Das Tile beginnt sofort im Editor zu animieren."], "minimap_title": "Minikarte", "minimap_body": ["Eine kleine Übersichtskarte oben links, aktivierbar über Menü → Minikarte. Zeigt die Position aller Objekte sowie einen Rahmen für den aktuell sichtbaren Ausschnitt.", "Ein Tippen auf die Minikarte öffnet ein Vollbild-Fenster — dort kann man die Vorschau flüssig verschieben, zoomen (+/− oder Mausrad) und mit \"Hierher springen\" die Hauptkarte dorthin bewegen."], "hotkeys_title": "Tastenkürzel (Desktop)", "hotkeys_body": ["Entf / Rücktaste — Auswahl löschen. Strg+C / Strg+V — kopieren / einfügen. Strg+Z — letzte Aktion rückgängig machen. Escape — Auswahl aufheben. Pfeiltasten — Verschiebung um 1 Pixel, mit Shift um 10."], "undo_title": "Rückgängig machen", "undo_body": ["Die Schaltfläche \"Rückgängig\" in der unteren Leiste macht so gut wie jede Aktion einen Schritt rückgängig: Platzieren, Löschen, Verschieben, Ebenenwechsel. Der Verlauf speichert die letzten 40 Schritte."], "export_title": "Projekte, Dateien und Sprite-Sheet-Import", "export_body": ["Menü → Projekte erlaubt das Anlegen mehrerer separater Karten und das Wechseln zwischen ihnen. Menü → Datei — die aktuelle Karte als Datei auf dem Gerät speichern oder eine zuvor gespeicherte Datei laden.", "Menü → Sprite-Sheet-Import — ein großes Blatt mit vielen Texturen hochladen und auf drei Arten in einzelne Tiles zerschneiden: gleichmäßiges Raster (Zellgröße oder Spalten-/Zeilenanzahl festlegen), manuell (ein Rechteck um das gewünschte Stück ziehen) oder \"intelligentes Schneiden\" (ein Algorithmus findet die Grenzen einzelner Grafiken anhand der Hintergrundtransparenz selbst)."]}, "pl": {"nav_title": "Spis treści", "page_title": "TileWeaver — Pomoc", "intro_title": "Czym jest TileWeaver", "intro_body": ["TileWeaver to darmowy, przeglądarkowy edytor izometrycznych map kafelkowych do gier 2D. Wgrywasz własne tekstury, rozmieszczasz je na mapie, pracujesz z warstwami i kolizjami, a na końcu eksportujesz wszystko do JSON, który odczyta twoja gra.", "Działa w całości w przeglądarce, nie trzeba niczego instalować. Projekt jest zapisywany lokalnie w przeglądarce (localStorage), więc możesz zamknąć kartę i wrócić później — wszystko zostanie na swoim miejscu."], "tiles_title": "Tekstury i foldery", "tiles_body": ["Przycisk \"+\" w górnym rzędzie wgrywa obraz jako nową teksturę (kafelek). Wybrany kafelek jest podświetlony żółtą ramką — to właśnie jego używa narzędzie \"Stawianie\".", "Nad paletą znajduje się rząd FOLDERÓW. Każda tekstura należy do dokładnie jednego folderu; aktualnie otwarty folder decyduje, co pokazuje paleta poniżej. Przycisk \"+\" na końcu rzędu folderów tworzy nowy. Przytrzymanie nazwy folderu przez 2 sekundy otwiera menu zmiany nazwy/usuwania — usunięcie folderu NIE usuwa tekstur, przenoszą się one do folderu zapasowego.", "Przytrzymanie samego kafelka (pół sekundy) otwiera okno edycji: zmiana nazwy, usunięcie lub ustawienie animacji (patrz \"Animowane kafelki\")."], "place_title": "Narzędzie \"Stawianie\"", "place_body": ["Najprostsze narzędzie: wybierz teksturę w palecie, dotknij mapy — kafelek pojawi się w tym miejscu, przyciągnięty do siatki (jeśli u dołu włączone jest \"Przyciąganie\"). Każdy nowy kafelek trafia na aktywną warstwę."], "select_title": "Narzędzie \"Zaznacz\" — praca z grupą", "select_body": ["Przeciągnij palcem po pustym miejscu mapy, aby narysować ramkę zaznaczenia. Wszystko, co się w niej znajdzie na AKTYWNEJ warstwie, staje się zaznaczeniem grupowym, a powyżej pojawia się panel akcji.", "Przyciski panelu: 👁 ukryj/przeciągnij panel, Kopiuj — do schowka (potem Ctrl+V lub przycisk \"Wklej\"), Ręka (Przeciągnij) — przełącza na narzędzie \"Przesuwanie\", by przeciągnąć całą grupę naraz, 🖨 Pieczątka — zapisuje grupę jako wielokrotnego użytku pieczątkę, dzięki której każde kolejne dotknięcie stawia nową kopię (oryginał zostaje na miejscu, każde dotknięcie tworzy nową kopię), ▧ Autokafelkowanie — stosuje skonfigurowane automatyczne podstawianie kafelków przejściowych (patrz odpowiedni rozdział), 🗑 — usuwa całą grupę (z potwierdzeniem)."], "pan_title": "Narzędzie \"Przesuwanie\" — ruch obiektu i działania na nim", "pan_body": ["Dotknij obiektu, aby zobaczyć panel akcji i uchwyty do zmiany rozmiaru w rogach. Przeciągnij sam obiekt, aby go przesunąć; przeciągnij uchwyt w rogu, aby zmienić rozmiar.", "Na panelu: Kolejność — liczba głębokości z (można wpisać ręcznie), ↔ odbicie w poziomie, ↕ odbicie w pionie, ↻ obrót, 🌑 cień-sylwetka (lepszy dla drzew), ⬭ cień-elipsa (lepszy dla budynków), 🔓 zablokuj obiekt, Kopiuj, 🗑 usuń.", "Zablokowanego obiektu (🔓 → 🔒) nie da się przypadkowo naruszyć: przeciąganie, zmiana rozmiaru, usuwanie są wyłączone, dopóki go nie odblokujesz (z potwierdzeniem, aby blokada też nie zniknęła przypadkiem)."], "pan2_title": "Zablokowany obiekt", "pan2_body": ["Gdy obiekt jest zablokowany, panel akcji pokazuje tylko jeden przycisk — \"🔒 Odblokuj\". To celowe działanie: zablokowany obiekt ma być całkowicie chroniony przed przypadkowymi zmianami, dopóki świadomie nie zdecydujesz się go odblokować."], "shadow_title": "Cień", "shadow_body": ["Dwa przyciski cienia na panelu \"Przesuwanie\" tworzą osobny obiekt-cień pod wybranym kafelkiem. 🌑 (sylwetka) odwzorowuje faktyczny kontur sprite'a — świetny dla drzew, krzewów, wszystkiego okrągłego. ⬭ (elipsa) to prosta, miękka owalna plama, która całkowicie ignoruje kształt sprite'a — lepiej pasuje do budynków, płotów i wszystkiego prostokątnego, gdzie cień-sylwetka wyglądałby dziwnie.", "Cień jest gotowy do przesunięcia zaraz po utworzeniu — narzędzie samo przełącza się na \"Przesuwanie\"."], "collision_title": "Kolizje", "collision_body": ["Narzędzie \"Kolizje\" rysuje niewidoczne w grze strefy (np. do sprawdzania, czy postać uderza w ścianę). Wybierz kształt (Kwadrat/Koło) i narysuj go przeciągnięciem.", "Dotknięcie już narysowanej kolizji (nawet gdy aktywne jest narzędzie \"Kolizje\") od razu ją zaznacza i pozwala przeciągnąć. Panel akcji kolizji ma te same możliwości co zwykły obiekt: kopiowanie, blokowanie, usuwanie — kolizje nie potrzebują cienia ani kolejności z, to po prostu kształty."], "clone_title": "Klon — stawianie wielu kafelków naraz", "clone_body": ["Cztery podtryby u góry: Linia — dotykasz punktu, wybierasz kierunek strzałką i liczbę, kafelki układają się w rząd. Wypełnij □ — przeciągasz prostokąt, wypełnia się cały. Wypełnij ◇ — to samo, ale w kształcie rombu (przydatne dla izometrycznych \"okręgów\"). Pieczątka — czwarty tryb, aktywowany automatycznie po naciśnięciu 🖨 Pieczątka na panelu zaznaczenia grupowego; każde dotknięcie stawia kopię całej zapisanej grupy."], "layers_title": "Warstwy", "layers_body": ["Warstwy biegną od lewej do prawej w kolejności tworzenia. Przycisk \"+\" dodaje nową warstwę (zawsze na górze w kolejności z). Dotknięcie nazwy warstwy czyni ją aktywną — wszystkie nowe kafelki trafiają właśnie na nią."], "layers2_title": "Menu warstwy (ikona zębatki)", "layers2_body": ["Zablokuj — cała warstwa staje się nietykalna. Zmień nazwę. Podnieś/Opuść — zmienia kolejność rysowania tej warstwy względem innych. Zmień głębokość — ręcznie wpisz liczbę z. Połącz widoczne — łączy wszystkie widoczne warstwy w jedną, zachowując wzajemną kolejność obiektów. Usuń warstwę — usuwa warstwę i WSZYSTKIE znajdujące się na niej obiekty (z potwierdzeniem)."], "autotile_title": "Autokafelkowanie", "autotile_body": ["Pozwala automatycznie podstawiać kafelki przejściowe na granicy dwóch materiałów (np. trawa/piasek), zamiast ręcznie dobierać każde połączenie.", "Konfiguracja: Menu → Autokafelkowanie → Nowa grupa. Siatka 3×3: cztery rogi to cztery różne materiały (kafelki źródłowe), cztery krawędzie między nimi to kafelki przejściowe dla styku dwóch sąsiednich (licząc po okręgu) materiałów. Dotknięcie komórki pozwala wybrać kafelek z palety.", "Zastosowanie: narzędziem \"Zaznacz\" zaznacz obszar mapy → na panelu zaznaczenia naciśnij \"▧ Autokafelkowanie\" → wszędzie w zaznaczonym obszarze, gdzie stoją kafelki z tej grupy, automatycznie zostaną podstawione odpowiednie warianty krawędziowe."], "animation_title": "Animowane kafelki", "animation_body": ["Tekstura może być animowana: poziomy pasek klatek w jednym pliku PNG (standardowy format, obsługiwany przez większość edytorów pixel-art przy eksporcie \"Sprite Sheet\").", "Przytrzymaj kafelek → zaznacz \"To animacja\" → ustaw liczbę klatek w pasku i szybkość w milisekundach na klatkę → zapisz. Kafelek od razu zacznie się animować prosto w edytorze."], "minimap_title": "Minimapa", "minimap_body": ["Mała mapa poglądowa w lewym górnym rogu, włączana przez Menu → Minimapa. Pokazuje położenie wszystkich obiektów oraz ramkę aktualnie widocznego obszaru.", "Dotknięcie minimapy otwiera pełnoekranowe okno — można w nim płynnie przewijać podgląd, przybliżać (+/− lub kółko myszy) i nacisnąć \"Przejdź tutaj\", aby przenieść tam główną mapę."], "hotkeys_title": "Skróty klawiszowe (komputer)", "hotkeys_body": ["Delete / Backspace — usuń zaznaczenie. Ctrl+C / Ctrl+V — kopiuj / wklej. Ctrl+Z — cofnij ostatnią akcję. Escape — usuń zaznaczenie. Strzałki — precyzyjne przesunięcie o 1 piksel, z Shift o 10."], "undo_title": "Cofnij", "undo_body": ["Przycisk \"Cofnij\" w dolnym pasku cofa niemal każdą akcję: stawianie, usuwanie, przesuwanie, zmianę warstwy. Historia przechowuje do 40 ostatnich kroków."], "export_title": "Projekty, pliki i import spritesheetów", "export_body": ["Menu → Projekty pozwala tworzyć kilka osobnych map i przełączać się między nimi. Menu → Plik — zapisz bieżącą mapę do pliku na urządzeniu lub wczytaj wcześniej zapisany plik.", "Menu → Import spritesheetu — wgrywasz jeden duży arkusz z wieloma teksturami i tniesz go na osobne kafelki na trzy sposoby: równa siatka (ustawiasz rozmiar komórki lub liczbę kolumn/wierszy), ręcznie (przeciągasz prostokąt wokół potrzebnego fragmentu) lub \"inteligentne cięcie\" (algorytm sam znajduje granice poszczególnych rysunków na podstawie przezroczystości tła)."]}};

var LANG_LABELS = {"ua": "UA", "en": "EN", "zh": "中文", "ko": "한국어", "de": "DE", "pl": "PL"};

</script>
<script>
(function(){
  var lang = localStorage.getItem('tw-help-lang') || 'ua';
  if(!TR[lang]) lang = 'ua';

  function setLang(l){
    lang = l;
    localStorage.setItem('tw-help-lang', l);
    document.documentElement.lang = l;
    render();
    document.querySelectorAll('#langRow button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang===l);
    });
  }

  function buildLangRow(){
    var row = document.getElementById('langRow');
    row.innerHTML = '';
    Object.keys(LANG_LABELS).forEach(function(code){
      var b = document.createElement('button');
      b.textContent = LANG_LABELS[code];
      b.dataset.lang = code;
      b.className = code===lang ? 'active' : '';
      b.addEventListener('click', function(){ setLang(code); });
      row.appendChild(b);
    });
  }

  function render(){
    var t = TR[lang];
    document.title = t.page_title;
    document.getElementById('footerText').textContent = t.intro_title;

    // Зміст
    var tocItems = [];
    var contentHtml = '';
    var counter = 0;

    ORDER.forEach(function(entry){
      var key = entry[0], imgKey = entry[1];
      var isExtraImage = key.indexOf('img2')>-1 || key==='tiles2img';
      if(isExtraImage){
        // Додаткове зображення без заголовка — просто ще один figure у попередній секції
        if(imgKey && IMAGES[imgKey]){
          contentHtml += '<figure><img src="data:image/png;base64,'+IMAGES[imgKey]+'" alt=""></figure>';
        }
        return;
      }
      counter++;
      var title = t[key+'_title'];
      var body = t[key+'_body'] || [];
      var anchorId = 'sec-'+key;
      tocItems.push('<li><a href="#'+anchorId+'">'+title+'</a></li>');
      contentHtml += '<section id="'+anchorId+'"><h2><span class="num">'+String(counter).padStart(2,'0')+'</span> '+title+'</h2>';
      body.forEach(function(p){ contentHtml += '<p>'+p+'</p>'; });
      if(imgKey && IMAGES[imgKey]){
        contentHtml += '<figure><img src="data:image/png;base64,'+IMAGES[imgKey]+'" alt="'+title+'"></figure>';
      }
      contentHtml += '</section>';
    });

    document.getElementById('toc').innerHTML = '<h2>'+t.nav_title+'</h2><ol>'+tocItems.join('')+'</ol>';
    document.getElementById('content').innerHTML = contentHtml;
  }

  buildLangRow();
  render();

  document.getElementById('backTop').addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
})();
</script>
